name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=graywhite&include_all_commits=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&number_format=long
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Cache-bust README image links
        run: |
          BUSTER=$(date +%s)
          sed -i -E "s|(profile/stats\.svg)(\?v=[0-9]+)?|\1?v=${BUSTER}|g" README.md
          sed -i -E "s|(profile/top-langs\.svg)(\?v=[0-9]+)?|\1?v=${BUSTER}|g" README.md

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg README.md
          git commit -m "Update README cards" || exit 0
          git push
